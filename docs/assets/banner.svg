<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
<title id="title">Unprompted — Work without the prompt.</title><desc id="desc">Unprompted’s open u mark with an offset dot. A continuous line connects notice, prepare, and verify.</desc>
<rect width="1280" height="340" rx="14" fill="#1d2734"/>
<g transform="translate(67 49) scale(1.03)" color="#d9e3f1"><path d="M18 17v20c0 18 28 18 28 0V28" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle cx="46" cy="14" r="5" fill="currentColor"/></g>
<text x="146" y="94" fill="#f1f4f7" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="650" letter-spacing="-1">unprompted.</text>
<text x="72" y="180" fill="#f1f4f7" font-family="system-ui,Segoe UI,sans-serif" font-size="52" font-weight="600" letter-spacing="-1.8">Work without the prompt.</text>
<text x="75" y="222" fill="#bac6d4" font-family="system-ui,Segoe UI,sans-serif" font-size="22">Useful initiative. Evidence behind every action.</text>
<path d="M72 286 H720 C790 286 795 120 865 120 S920 218 985 218 S1090 120 1208 120" fill="none" stroke="#b8cce4" stroke-width="2.5"/>
<g fill="#b8cce4"><circle cx="865" cy="120" r="7"/><circle cx="985" cy="218" r="7"/><circle cx="1208" cy="120" r="7"/></g>
<g fill="#bac6d4" font-family="system-ui,Segoe UI,sans-serif" font-size="15"><text x="838" y="90">Notice</text><text x="956" y="253">Prepare</text><text x="1180" y="90">Verify</text></g>
</svg>
