name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and evaluations
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to a full commit SHA so a moved tag cannot inject code into CI.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Pi and its model layer are optional, pinned runtime dependencies.
      - name: Install from lockfile
        run: npm ci --include=optional --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check:syntax

      - name: Public files and documentation
        run: npm run check:public

      - name: Behavioural suite
        run: npm test

      - name: Generalisation evaluation
        run: npm run eval

      - name: Framework evaluation
        run: npm run eval:framework

      - name: Harness resilience evaluation
        run: npm run eval:resilience

      - name: Whole-work lifecycle evaluation
        run: npm run eval:lifecycle

      - name: Pi contract evaluation
        if: matrix.node == 22
        run: npm run eval:pi

      - name: Scripted workflow outcome evaluation
        run: npm run eval:value

  browser:
    name: First-run and interaction contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UNPROMPTED_BROWSER_CHANNEL: chrome
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Keep browser tooling separate. The app itself is tested without npm ci.
      - name: Install browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/unprompted-browser" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          # The hosted image includes Chrome and its system dependencies.
          # Avoid upgrading unrelated apt packages before every browser run.
          google-chrome --version

      - name: Run actual first-use story
        env:
          UNPROMPTED_PLAYWRIGHT_MODULE: ${{ runner.temp }}/unprompted-browser/node_modules/playwright/index.mjs
        run: npm run test:first-run

      - name: Run model connection and primary interpretation
        env:
          UNPROMPTED_PLAYWRIGHT_MODULE: ${{ runner.temp }}/unprompted-browser/node_modules/playwright/index.mjs
        run: npm run test:model-onboarding

      - name: Run live-update interaction contract
        env:
          UNPROMPTED_PLAYWRIGHT_MODULE: ${{ runner.temp }}/unprompted-browser/node_modules/playwright/index.mjs
        run: npm run test:browser

      - name: Run real-workspace onboarding contract
        env:
          UNPROMPTED_PLAYWRIGHT_MODULE: ${{ runner.temp }}/unprompted-browser/node_modules/playwright/index.mjs
        run: npm run test:google-onboarding

      - name: Run GitHub and Outlook connection contracts
        env:
          UNPROMPTED_PLAYWRIGHT_MODULE: ${{ runner.temp }}/unprompted-browser/node_modules/playwright/index.mjs
        run: npm run test:connections

  tooling:
    name: Contributor tooling · ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test cross-platform contributor tools
        run: node --test test/test-runner.test.js test/check-syntax.test.js
